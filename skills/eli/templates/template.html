<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=Gowun+Batang:wght@700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#16213A; --muted:#5B6579; --line:#D5DAE5;
  --accent:#2447D6; --accent-ink:#FFFFFF; --hi:#F5C542; --hi-ink:#2A2000;
  --soft:#E6EBFA; --tile:#F4F6FB; --code-bg:#1B2338; --code-ink:#E8ECF5; --bad:#C43D3D;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1320; --surface:#171E2E; --ink:#E7EBF4; --muted:#9AA5BD; --line:#2A3448;
    --accent:#7D95FF; --accent-ink:#0B1026; --hi:#F5C542; --hi-ink:#2A2000;
    --soft:#22305A; --tile:#1F283C; --code-bg:#0A0F1B; --code-ink:#DCE2F0; --bad:#FF7B7B;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#171E2E; --ink:#E7EBF4; --muted:#9AA5BD; --line:#2A3448;
  --accent:#7D95FF; --accent-ink:#0B1026; --hi:#F5C542; --hi-ink:#2A2000;
  --soft:#22305A; --tile:#1F283C; --code-bg:#0A0F1B; --code-ink:#DCE2F0; --bad:#FF7B7B;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:22px 0 0;flex-wrap:wrap}
h1{font-family:"Gowun Batang","Apple Myungjo",serif;font-weight:700;font-size:28px;margin:0 0 14px;letter-spacing:-0.01em;text-wrap:balance}
h1 small{display:block;font-family:"IBM Plex Sans KR",sans-serif;font-weight:400;font-size:13px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:4px}
.tabs{display:flex;gap:4px}
.tab{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:15px;padding:10px 16px;border-bottom:3px solid transparent;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
main{padding:28px 0 80px}
.lead{font-family:"Gowun Batang",serif;font-size:21px;line-height:1.5;margin:0 0 28px;padding:0 0 22px;border-bottom:1px solid var(--line);text-wrap:balance;word-break:keep-all}
.note{font-size:14px;color:var(--muted);margin:-14px 0 24px}
.cards{display:flex;flex-direction:column;gap:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fig{background:var(--soft);padding:26px 22px;display:flex;flex-direction:column;align-items:center;gap:14px}
.fig svg{width:100%;max-width:520px;height:auto;display:block}
.pipe,.grid{width:100%;max-width:520px}
.pipe svg,.grid svg{width:100%;height:auto;display:block}
.fig p{margin:0;font-size:14px;color:var(--muted);text-align:center;max-width:56ch}
.body{padding:20px 24px 24px}
h3{font-family:"Gowun Batang",serif;font-size:20px;margin:0 0 10px;text-wrap:balance;word-break:keep-all}
/* term: <div class="term"><b>한글</b><i>English</i><span>뜻</span></div> */
.term{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:var(--tile);border-left:3px solid var(--accent);padding:10px 14px;margin:0 0 14px;font-size:15px}
.term b{font-weight:600;white-space:nowrap}
.term i{font-style:normal;color:var(--muted);font-family:"IBM Plex Mono",monospace;font-size:13px}
.term span{grid-column:1/-1}
ul{margin:0;padding-left:20px}
li{margin:6px 0}
li+li{margin-top:8px}
/* tiles: <div class="tiles"><span class="tile">조각</span><span class="tile hi">방금 고른 것</span><span class="tile q">?</span><span class="tile ghost">흐림</span></div> */
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:8px 14px;font-size:18px;font-weight:600;min-width:44px;text-align:center}
.tile.hi{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.tile.ghost{opacity:.35;border-style:dashed}
.tile.q{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tile small{display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:400;color:var(--muted);margin-top:2px}
.tile.hi small{color:var(--hi-ink)}
.arrow{color:var(--muted);font-size:22px;line-height:1}
.rows{display:flex;flex-direction:column;gap:10px;width:100%;max-width:520px}
.rows .tiles{justify-content:flex-start}
/* bars: <div class="bars"><span class="lbl">이름</span><div class="bar pick"><i style="width:41%"></i></div><span class="val">0.41</span> ...</div>  (.pick 노랑, .cut 회색) */
.bars{width:100%;max-width:460px;display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;font-variant-numeric:tabular-nums}
.bars .lbl{font-weight:600;text-align:right;white-space:nowrap}
.bars .bar{height:22px;background:var(--line);border-radius:3px;overflow:hidden}
.bars .bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.bars .bar.pick i{background:var(--hi)}
.bars .bar.cut i{background:var(--line);opacity:.7}
.bars .bar.mono i{background:var(--muted)}
.bars .val{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted);min-width:4ch;text-align:right}
/* flow: <div class="flow"><div class="box">입력<small>설명</small></div><span class="arrow">→</span><div class="box acc">핵심</div></div> */
.flow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.box{background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:10px 14px;font-weight:600;text-align:center;font-size:15px}
.box.acc{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.box.bad{border-color:var(--bad)}
.box small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.box.acc small{color:var(--accent-ink);opacity:.85}
.box.bad small{color:var(--bad)}
/* stepper: <div class="stepper"><div class="step"><div class="stage">그림</div><p class="cap"><b>1 이름</b> : 설명</p></div> ...</div>  (버튼과 점은 JS가 붙임) */
.stepper{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px}
.stepper .step{display:none;flex-direction:column;gap:14px}
.stepper .step.on{display:flex}
.stage{min-height:200px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px}
.stage > *{width:100%}
.fig p.cap{margin:0;font-size:15px;text-align:left;color:var(--ink);max-width:none;word-break:keep-all}
.cap b{color:var(--accent)}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ctl button{appearance:none;font:inherit;font-weight:600;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:8px 16px;cursor:pointer}
.ctl button.sec{background:transparent;color:var(--accent)}
.ctl button:disabled{opacity:.4;cursor:default}
.ctl button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.vec{display:flex;gap:2px;justify-content:center;margin-top:6px}
.vec i{width:10px;height:14px;border-radius:2px;display:block}
/* sim: <div class="sim"><div class="knobs"><label>이름 <output>0.8</output><input type="range"></label><div class="stat"></div></div><div class="bars"></div></div> */
.sim{width:100%;max-width:560px;display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}
.sim .knobs{display:flex;flex-direction:column;gap:16px}
.sim label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.sim label output{font-family:"IBM Plex Mono",monospace;font-weight:400;color:var(--accent)}
.sim input[type=range]{width:100%;accent-color:var(--accent)}
.sim .stat{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:560px){.sim{grid-template-columns:1fr}}
/* glossary: <div class="tablewrap"><table><thead><tr><th>뜻</th><th>입문 탭 비유</th><th>영어</th></tr></thead><tbody><tr><td>..</td><td class="an">..</td><td class="en">..</td></tr></tbody></table></div> */
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.en{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted);white-space:nowrap}
td.an{color:var(--muted)}
.tablewrap{overflow-x:auto;width:100%}
/* code: <div class="pre-wrap"><pre><code>...</code></pre></div>  (터미널 재생은 .term-line.you / .term-line.out / .term-line.edit) */
pre{margin:0;background:var(--code-bg);color:var(--code-ink);padding:16px 18px;border-radius:6px;overflow-x:auto;font-family:"IBM Plex Mono",monospace;font-size:13.5px;line-height:1.6;width:100%}
code{font-family:"IBM Plex Mono",monospace}
li code, p code, td code{background:var(--tile);padding:1px 5px;border-radius:3px;font-size:.9em}
.pre-wrap{width:100%;max-width:640px}
pre .you{color:var(--hi)}
pre .edit{background:rgba(245,197,66,.25);outline:1px solid var(--hi);border-radius:2px}
pre .dim{opacity:.55}
pre .err{color:#FF8A8A}
/* two: <div class="two"><div><h4 class="ok">쓰기 좋음</h4><ul>..</ul></div><div><h4 class="no">피해야 함</h4><ul>..</ul></div></div> */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%;max-width:560px}
.two > div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.two h4{margin:0 0 8px;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.two h4.ok{color:var(--accent)} .two h4.no{color:var(--bad)}
.two ul{padding-left:18px;font-size:14.5px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
/* ctx: <div class="ctx"><span style="flex:2;background:var(--accent)">이름</span>...</div><div class="ctx-legend"><span>..</span></div> */
.ctx{width:100%;max-width:560px;display:flex;height:34px;border-radius:5px;overflow:hidden;font-size:12.5px;font-weight:600}
.ctx span{display:flex;align-items:center;justify-content:center;color:var(--accent-ink);white-space:nowrap;overflow:hidden}
.ctx-legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--muted)}
/* before/after: <div class="ba"><div><h4>전</h4>...</div><div><h4>후</h4>...</div></div> */
.ba{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:560px}
.ba > div{min-width:0}
.ba h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media (max-width:560px){.ba{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<header>
  <div class="wrap head">
    <h1><small>eli</small>{{TITLE}}</h1>
    <div class="tabs" id="tabs" role="tablist" aria-label="설명 수준"></div>
  </div>
</header>

<main class="wrap">
{{SECTIONS}}
</main>

<script>
(function(){
  // ---- tabs: built from <section data-tab="5살|입문|실무" data-default> ----
  var panels=[].slice.call(document.querySelectorAll('main > section[data-tab]'));
  var bar=document.getElementById('tabs');
  var key='eli-tab:'+document.title;
  function select(i){
    panels.forEach(function(p,j){p.hidden=j!==i;});
    [].slice.call(bar.children).forEach(function(b,j){b.setAttribute('aria-selected',j===i?'true':'false');});
    try{localStorage.setItem(key,String(i));}catch(e){}
    window.scrollTo({top:0});
  }
  panels.forEach(function(p,i){
    p.setAttribute('role','tabpanel'); p.id=p.id||('panel-'+i);
    var b=document.createElement('button');
    b.className='tab'; b.type='button'; b.setAttribute('role','tab'); b.setAttribute('aria-controls',p.id);
    b.textContent=p.getAttribute('data-tab'); b.addEventListener('click',function(){select(i);});
    bar.appendChild(b);
  });
  if(panels.length<2){bar.hidden=true;}
  var start=0;
  panels.forEach(function(p,i){if(p.hasAttribute('data-default'))start=i;});
  try{var s=localStorage.getItem(key);if(s!==null&&panels[+s])start=+s;}catch(e){}
  select(start);

  // ---- pipe / grid helpers: repeated box pictures without hand-written SVG ----
  // <div class="pipe" data-boxes="분해,맥락,생성,검증,기록" data-hi="2" data-back="4>3"></div>
  // <div class="grid" data-cells="제목|부제,제목|부제,…" data-cols="2" data-hi="3"></div>
  var FONT='IBM Plex Sans KR, sans-serif';
  function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  function pipeSvg(boxes,hi,back){
    var H=130,G=20,M=30,BH=50,ws=boxes.map(function(b){return Math.max(80,b.length*18+24);});
    var W=M*2+ws.reduce(function(a,b){return a+b;},0)+G*(boxes.length-1);
    var x=M,xs=[],o='<svg viewBox="0 0 '+W+' '+H+'" font-family="'+FONT+'">';
    boxes.forEach(function(b,i){
      var on=(i+1)===hi;xs.push(x+ws[i]/2);
      o+='<rect x="'+x+'" y="40" width="'+ws[i]+'" height="'+BH+'" rx="8" '+(on?'fill="var(--hi)"':'fill="var(--surface)" stroke="var(--line)" stroke-width="2"')+'/>';
      o+='<text x="'+(x+ws[i]/2)+'" y="70" text-anchor="middle" font-size="15" '+(on?'font-weight="600" fill="var(--hi-ink)"':'fill="var(--muted)"')+'>'+esc(b)+'</text>';
      x+=ws[i]+G;
    });
    if(back){var m=/^(\d+)\s*>\s*(\d+)$/.exec(back);if(m){var a=xs[+m[1]-1],b=xs[+m[2]-1];
      o+='<path d="M'+a+' 95 Q'+a+' 118 '+((a+b)/2)+' 118 Q'+b+' 118 '+b+' 95" fill="none" stroke="var(--bad)" stroke-width="2" stroke-dasharray="5 4"/>';
      o+='<path d="M'+(b-6)+' 102 L'+b+' 94 L'+(b+6)+' 102 Z" fill="var(--bad)"/>';}}
    return o+'</svg>';
  }
  function gridSvg(cells,cols,hi){
    var wide=cols>=4,CW=wide?130:190,CH=76,G=wide?14:20,MX=wide?30:60,MY=40,rows=Math.ceil(cells.length/cols);
    var W=MX*2+cols*CW+(cols-1)*G,H=MY*2+rows*CH+(rows-1)*G;
    var o='<svg viewBox="0 0 '+W+' '+H+'" font-family="'+FONT+'">';
    cells.forEach(function(c,i){
      var on=(i+1)===hi,parts=c.split('|'),x=MX+(i%cols)*(CW+G),y=MY+Math.floor(i/cols)*(CH+G),cx=x+CW/2;
      o+='<rect x="'+x+'" y="'+y+'" width="'+CW+'" height="'+CH+'" rx="10" '+(on?'fill="var(--hi)"':'fill="var(--surface)" stroke="var(--line)" stroke-width="2"')+'/>';
      if(parts.length>1){
        o+='<text x="'+cx+'" y="'+(y+32)+'" text-anchor="middle" font-size="16" font-weight="600" fill="'+(on?'var(--hi-ink)':'var(--ink)')+'">'+esc(parts[0])+'</text>';
        o+='<text x="'+cx+'" y="'+(y+57)+'" text-anchor="middle" font-size="13" fill="'+(on?'var(--hi-ink)':'var(--muted)')+'">'+esc(parts[1])+'</text>';
      }else{
        o+='<text x="'+cx+'" y="'+(y+44)+'" text-anchor="middle" font-size="16" font-weight="600" fill="'+(on?'var(--hi-ink)':'var(--ink)')+'">'+esc(parts[0])+'</text>';
      }
    });
    return o+'</svg>';
  }
  function list(el,name){return (el.getAttribute(name)||'').split(',').map(function(t){return t.trim();}).filter(Boolean);}
  [].slice.call(document.querySelectorAll('.pipe[data-boxes]')).forEach(function(el){
    el.innerHTML=pipeSvg(list(el,'data-boxes'),+(el.getAttribute('data-hi')||0),el.getAttribute('data-back'));
  });
  [].slice.call(document.querySelectorAll('.grid[data-cells]')).forEach(function(el){
    el.innerHTML=gridSvg(list(el,'data-cells'),+(el.getAttribute('data-cols')||2),+(el.getAttribute('data-hi')||0));
  });

  // ---- stepper: <div class="stepper"><div class="step">…</div>…</div> ----
  // shortcut: <div class="stepper" data-pipe="a,b,c" data-back="3>2"> and steps with only <p class="cap"> -> stage is a pipe with step i highlighted
  [].slice.call(document.querySelectorAll('.stepper')).forEach(function(st){
    var steps=[].slice.call(st.querySelectorAll(':scope > .step')); if(!steps.length)return;
    var pipe=list(st,'data-pipe');
    if(pipe.length){steps.forEach(function(sp,i){
      if(sp.querySelector('.stage'))return;
      var back=st.getAttribute('data-back'),m=back&&/^(\d+)/.exec(back);
      var stage=document.createElement('div');stage.className='stage';
      stage.innerHTML=pipeSvg(pipe,i+1,(m&&+m[1]===i+1)?back:null);
      sp.insertBefore(stage,sp.firstChild);
    });}
    var idx=0;
    var ctl=document.createElement('div'); ctl.className='ctl';
    var prev=document.createElement('button'); prev.type='button'; prev.className='sec'; prev.textContent='이전';
    var dots=document.createElement('div'); dots.className='dots';
    var next=document.createElement('button'); next.type='button'; next.className='next';
    ctl.appendChild(prev); ctl.appendChild(dots); ctl.appendChild(next); st.appendChild(ctl);
    function render(){
      steps.forEach(function(s,i){s.classList.toggle('on',i===idx);});
      dots.innerHTML=steps.map(function(_,i){return '<i class="'+(i===idx?'on':'')+'"></i>';}).join('');
      prev.disabled=idx===0; next.textContent=idx===steps.length-1?'처음으로':'다음 단계';
    }
    prev.addEventListener('click',function(){if(idx>0){idx--;render();}});
    next.addEventListener('click',function(){idx=(idx+1)%steps.length;render();});
    render();
  });

  // ---- helpers for hand-written simulators ----
  window.eli={
    softmax:function(logits,T){T=T||1;var m=Math.max.apply(null,logits);var ex=logits.map(function(l){return Math.exp((l-m)/T);});var s=ex.reduce(function(a,b){return a+b;},0);return ex.map(function(e){return e/s;});},
    // rows: [{label, pct(0-100), val(text), cls('pick'|'cut'|'mono'|'')}] -> innerHTML for a .bars element
    bars:function(rows){return rows.map(function(r){return '<span class="lbl">'+r.label+'</span><div class="bar '+(r.cls||'')+'"><i style="width:'+Math.max(2,Math.round(r.pct))+'%"></i></div><span class="val">'+(r.val==null?'':r.val)+'</span>';}).join('');}
  };
})();
</script>
<!-- 주제별 스크립트(시뮬레이터 등)는 이 줄 아래에 <script>로 둔다. window.eli 를 쓸 수 있음 -->
{{SCRIPTS}}
